<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 15px;
            padding: 13px 16px;
            border-radius: 14px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user {
            background: #ddd;
        }

        .ai {
            background: white;
            border: 1px solid #ddd;
        }

        .error {
            background: #ffe5e5;
            color: #b00000;
            border: 1px solid #ffb0b0;
        }

        .label {
            font-size: 12px;
            font-weight: bold;
            opacity: .6;
            margin-bottom: 5px;
        }

        .input-area {
            background: white;
            border-top: 1px solid #ddd;
            padding: 10px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            border: none;
            background: #111;
            color: white;
            border-radius: 12px;
            padding: 0 18px;
            font-size: 15px;
        }

        button:disabled {
            opacity: .5;
        }
    </style>
</head>

<body>

<header>
    🤖 My AI
</header>

<div id="chat">
    <div class="message ai">
        <div class="label">MY AI</div>
        Xin chào! Hãy gửi tin nhắn cho mình.
    </div>
</div>

<div class="input-area">
    <div class="input-box">
        <textarea
            id="message"
            placeholder="Nhập tin nhắn..."
            rows="1"
        ></textarea>

        <button id="send">Gửi</button>
    </div>
</div>

<script>
const input = document.getElementById("message");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text, type, label) {
    const box = document.createElement("div");
    box.className = "message " + type;

    const title = document.createElement("div");
    title.className = "label";
    title.textContent = label;

    const content = document.createElement("div");
    content.textContent = text;

    box.appendChild(title);
    box.appendChild(content);

    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user", "BẠN");

    input.value = "";
    send.disabled = true;
    send.textContent = "...";

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const raw = await response.text();

        console.log("SERVER STATUS:", response.status);
        console.log("SERVER RESPONSE:", raw);

        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error(
                "Server trả về dữ liệu không hợp lệ: " + raw
            );
        }

        if (!response.ok) {
            throw new Error(
                data.error || "Server lỗi HTTP " + response.status
            );
        }

        if (!data.reply) {
            throw new Error("API không trả về nội dung.");
        }

        addMessage(data.reply, "ai", "MY AI");

    } catch (error) {
        console.error("CHAT ERROR:", error);

        addMessage(
            "LỖI: " + error.message,
            "error",
            "SYSTEM"
        );
    }

    send.disabled = false;
    send.textContent = "Gửi";
    input.focus();
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
